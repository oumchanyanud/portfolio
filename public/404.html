<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chanyanud Sriyota</title>
    <!--
      Single Page Apps for GitHub Pages
      GitHub Pages serves this file for any unknown path (e.g. a refresh on /portfolio/work).
      Stash the requested URL and bounce to the app entry, which restores it via history API.
    -->
    <script>
      sessionStorage.redirect = location.href
      location.replace('/portfolio/')
    </script>
  </head>
  <body></body>
</html>
